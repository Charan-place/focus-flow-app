# Render blueprint — deploys the FocusFlow API.
# In Render: New → Blueprint → connect this repo → it reads this file.
# Then set the secret env vars (MONGODB_URI, JWT_SECRET, GOOGLE_WEB_CLIENT_ID)
# in the dashboard (NOT here — never commit secrets).

services:
  - type: web
    name: focusflow-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
